apiVersion: v1
kind: ConfigMap
metadata:
  name: authlab-config
  namespace: authlab
  labels:
    app.kubernetes.io/name: authlab
    app.kubernetes.io/part-of: secure-deploy-lab
    app.kubernetes.io/component: config
    app.kubernetes.io/managed-by: kubectl
data:
  DEV_MODE: "true"
  FLASK_DEBUG: "false"

  HOST: "0.0.0.0"
  PORT: "5000"

  # MFA is intentionally disabled for this local deploy-hardening lab.
  # This project focuses on container/Kubernetes workload hardening,
  # not MFA flow validation.
  ADMIN_MFA_ENABLED: "false"
  MFA_WINDOW: "1"
  MFA_BUCKET: "login_mfa"

  # Base login rate limit settings.
  WINDOW_SEC: "60"
  MAX_ATTEMPTS: "5"
  RATE_BUCKET: "login"

 
  DB_PATH: "data/authlab.db"

  # Kubernetes/container-native logging.
  # Logs should go to stdout/stderr so kubectl logs can collect them.
  LOG_TO_STDOUT: "true"
  LOG_DIR: "logs"

  WEB_GUESTBOOK_BUCKET: "web_guestbook"
  WEB_GUESTBOOK_WINDOW_SEC: "65"
  WEB_GUESTBOOK_MAX_ATTEMPTS: "10"

  WEB_NOTES_BUCKET: "web_notes"
  WEB_NOTES_WINDOW_SEC: "30"
  WEB_NOTES_MAX_ATTEMPTS: "60"

  XSS_R_STATE: "safe"
  XSS_S_STATE: "safe"
  SQLI_STATE: "safe"
  IDOR_STATE: "safe"

  MAX_MSG_LEN: "500"

  API_AUTH_BUCKET: "api_auth"
  API_GUESTBOOK_BUCKET: "api_guestbook"
  API_PRODUCTS_BUCKET: "api_products"
  API_NOTES_BUCKET: "api_notes"