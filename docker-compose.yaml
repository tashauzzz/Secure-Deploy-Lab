services:
  authlab:
    image: ${AUTHLAB_IMAGE_REF:-authlab-deploy:baseline}
    build:
      context: .
      dockerfile: ${AUTHLAB_DOCKERFILE:-dockerfile.baseline}
      args:
        AUTHLAB_UID: ${AUTHLAB_UID:-1000}
        AUTHLAB_GID: ${AUTHLAB_GID:-1000}
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ${AUTHLAB_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      LOG_TO_STDOUT: ${AUTHLAB_LOG_TO_STDOUT:-false}
    volumes:
      - ./data:/app/data